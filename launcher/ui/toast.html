<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Logro</title>
<style>
:root{--ink:#e8f3ff;--mute:#8aa3c4;--cyan:#3fd0ff;--cyan2:#1d8dff;--pink:#ff3fb4;--display:"Bahnschrift","Segoe UI",sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:transparent;user-select:none;font-family:var(--display);cursor:none}
#card{position:absolute;right:10px;top:12px;width:600px;height:118px;display:flex;align-items:center;gap:22px;padding:0 26px 0 24px;
  transform:translateX(115%);opacity:0;
  background:linear-gradient(100deg,rgba(6,14,32,.97),rgba(10,26,58,.95) 65%,rgba(40,10,46,.95));border:1px solid rgba(88,170,255,.45);
  clip-path:polygon(0 0,calc(100% - 20px) 0,100% 20px,100% 100%,20px 100%,0 calc(100% - 20px));box-shadow:0 0 30px rgba(29,141,255,.35)}
#card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--cyan);box-shadow:0 0 14px var(--cyan)}
#card.in{animation:slide .7s cubic-bezier(.2,.9,.25,1.08) forwards}
#card.out{animation:leave .5s cubic-bezier(.5,0,.8,.4) forwards}
@keyframes slide{from{transform:translateX(115%);opacity:0}to{transform:none;opacity:1}}
@keyframes leave{from{transform:none;opacity:1}to{transform:translateX(115%);opacity:0}}
.sweep{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.sweep i{position:absolute;inset:0;background:linear-gradient(100deg,transparent 38%,rgba(120,210,255,.3) 50%,transparent 62%);background-size:260% 100%;background-position:130% 0}
#card.in .sweep i{animation:sweep 1.4s .5s ease-in-out forwards}
@keyframes sweep{to{background-position:-130% 0}}
.badge{position:relative;flex:none;width:72px;height:72px;display:flex;align-items:center;justify-content:center}
.badge .dia{position:absolute;inset:10px;transform:rotate(45deg);border:2px solid var(--cyan);background:radial-gradient(circle,rgba(63,208,255,.5),rgba(8,30,80,.95) 70%);box-shadow:0 0 16px rgba(63,208,255,.7)}
.badge .num{position:relative;font-size:22px;font-weight:700;color:#fff;text-shadow:0 0 8px rgba(63,208,255,.9)}
.ring{position:absolute;inset:4px;transform:rotate(45deg);border:2px solid rgba(160,230,255,.9);opacity:0}
#card.in .ring{animation:ring 1.1s .45s ease-out forwards}
@keyframes ring{0%{transform:rotate(45deg) scale(.7);opacity:.95}100%{transform:rotate(45deg) scale(1.6);opacity:0}}
.txt{flex:1;min-width:0}
.k{font-size:12px;font-weight:700;letter-spacing:4px;color:var(--cyan)}
.t{font-size:24px;font-weight:600;letter-spacing:1px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:4px 0 2px}
.d{font-size:16px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>
</head>
<body>
<div id="card">
  <div class="sweep"><i></i></div>
  <div class="badge"><div class="dia"></div><div class="ring"></div><span class="num" id="num">★</span></div>
  <div class="txt"><div class="k" id="k">LOGRO DESBLOQUEADO · NEURON</div><div class="t" id="t"></div><div class="d" id="d"></div></div>
</div>
<script>
(() => {
  const host = window.acHost;
  const $ = (id) => document.getElementById(id);
  const card = $('card');
  let actx = null;
  const tone = (f, t0, dur, type, vol) => { const t = actx.currentTime + t0, o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t); g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .015); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g).connect(actx.destination); o.start(t); o.stop(t + dur + .02); };
  const chime = () => { try { actx = actx || new AudioContext(); [[880, 0], [1318, .09], [1760, .18]].forEach(([f, t]) => tone(f, t, .5, 'sine', .07)); tone(2637, .27, .7, 'triangle', .03); } catch (e) {} };
  if (host) host.addEventListener('message', (ev) => {
    let m; try { m = JSON.parse(ev.data); } catch (e) { return; }
    if (m.type !== 'show') return;
    const a = m.data || {};
    $('k').textContent = a.lang === 'en' ? 'ACHIEVEMENT UNLOCKED · NEURON' : 'LOGRO DESBLOQUEADO · NEURON';
    $('t').textContent = a.title || ''; $('d').textContent = a.description || ''; $('num').textContent = a.mark || '★';
    card.className = ''; void card.offsetWidth; card.className = 'in';
    if (a.sound !== false) chime();
    clearTimeout(card._t);
    card._t = setTimeout(() => { card.className = 'out'; setTimeout(() => host.postMessage(JSON.stringify({ cmd: 'toastDone' })), 550); }, 5200);
  });
})();
</script>
</body>
</html>
