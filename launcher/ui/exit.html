<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Pausa</title>
<style>
:root{--ink:#e8f3ff;--mute:#8aa3c4;--line:rgba(88,170,255,.35);--cyan:#3fd0ff;--cyan2:#1d8dff;--display:"Bahnschrift","Segoe UI",sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:transparent;user-select:none;font-family:var(--display)}
#veil{position:fixed;inset:0;background:radial-gradient(ellipse at center,rgba(5,12,28,.6) 0%,rgba(2,5,12,.92) 75%);opacity:0;transition:opacity .3s ease}
#veil::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(120,200,255,.04) 0 1px,transparent 1px 4px)}
#black{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .45s ease}
body.show #veil{opacity:1}
body.out #black{opacity:1}
#fx{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .6s ease}
body.show #fx{opacity:1}
#card{position:fixed;left:50%;top:50%;width:720px;padding:34px 46px 28px;transform:translate(-50%,-46%) scale(.97);opacity:0;
  transition:opacity .3s ease, transform .4s cubic-bezier(.2,.8,.2,1);
  background:rgba(7,15,32,.95);border:1px solid var(--line);text-align:center;
  clip-path:polygon(0 0,calc(100% - 24px) 0,100% 24px,100% 100%,24px 100%,0 calc(100% - 24px));
  box-shadow:0 0 60px rgba(29,141,255,.25)}
body.show #card{opacity:1;transform:translate(-50%,-50%) scale(1)}
#card::before{content:"";position:absolute;left:0;top:0;width:100%;height:3px;background:linear-gradient(90deg,transparent,var(--cyan),transparent);animation:scan 2.6s linear infinite}
@keyframes scan{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.orn{display:block;margin:0 auto 10px;color:var(--cyan)}
.kick{font-size:13px;letter-spacing:6px;color:var(--cyan);opacity:.8;margin-bottom:6px}
h1{margin:0 0 6px;font-weight:600;font-size:30px;letter-spacing:6px;color:var(--ink)}
p{margin:0 0 24px;font-size:17px;color:var(--mute)}
.view{display:none}
.view.on{display:block;animation:viewIn .25s ease}
@keyframes viewIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.menu{display:flex;flex-direction:column;gap:10px;text-align:left;margin-top:18px}
.item{position:relative;display:flex;align-items:center;gap:16px;min-height:58px;padding:8px 20px;border:1px solid rgba(88,170,255,.18);background:rgba(16,32,64,.4);transition:all .15s ease}
.item .lbl{font-size:19px;font-weight:600;letter-spacing:2.5px;color:#dbe9fb;white-space:nowrap}
.item .sub{display:block;font-size:14px;font-weight:400;letter-spacing:.5px;color:#7f97b8;margin-top:2px}
.item.on{background:linear-gradient(90deg,rgba(29,141,255,.55),rgba(29,141,255,.12));border-color:var(--cyan);box-shadow:inset 5px 0 0 var(--cyan),0 0 22px rgba(63,208,255,.25)}
.item.on .lbl{color:#fff} .item.on .sub{color:#bcd6f5}
.slider{display:flex;align-items:center;gap:12px;flex:1;min-width:280px;margin-left:auto}
.track{position:relative;flex:1;height:10px;background:rgba(88,170,255,.18);touch-action:none}
.fill{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--cyan2),var(--cyan))}
.ticks{position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 calc(10% - 1px),rgba(5,12,28,.6) calc(10% - 1px) 10%);pointer-events:none}
.knob{position:absolute;top:50%;width:14px;height:22px;margin:-11px 0 0 -7px;background:#fff;box-shadow:0 0 10px var(--cyan)}
.val{min-width:56px;text-align:right;font-size:17px;font-weight:600;letter-spacing:1px;color:#dbe9fb}
.arrow{font-size:12px;color:var(--cyan);opacity:0}
.item.on .arrow{opacity:.9}
.opts{display:flex;gap:22px;justify-content:center}
button{position:relative;min-width:180px;height:52px;font-family:var(--display);font-size:19px;font-weight:600;letter-spacing:4px;
  color:var(--ink);background:rgba(16,32,64,.4);border:1px solid var(--line);transition:all .15s ease}
button.on{color:#fff;background:linear-gradient(180deg,#1a6cff,#0b3a9e);border-color:var(--cyan);box-shadow:0 0 20px rgba(63,160,255,.55)}
.hint{margin-top:22px;font-size:12px;letter-spacing:2.5px;color:#7f97b8}
html,body{cursor:-webkit-image-set(url(assets/cursor.png) 1x,url(assets/cursor@2x.png) 2x) 1 1,default}
button,.item,.track{cursor:-webkit-image-set(url(assets/cursor_on.png) 1x,url(assets/cursor_on@2x.png) 2x) 1 1,pointer}
html.padmode,html.padmode *{cursor:none!important}
</style>
</head>
<body>
<div id="veil"></div>
<canvas id="fx"></canvas>
<div id="card" role="dialog" aria-labelledby="t">
  <svg class="orn" width="44" height="40" viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M20 3 37 35H3Z"/><path d="M20 15 28 30H12Z" fill="currentColor" stroke="none"/></svg>
  <div class="kick" id="kick">NEURON · OPERACIÓN EN CURSO</div>
  <!-- menú de pausa -->
  <div class="view on" id="vMenu">
    <h1 id="mTitle">EN PAUSA</h1>
    <div class="menu" id="menu">
      <div class="item" data-i="0"><span class="lbl" id="lVol">VOLUMEN DEL JUEGO</span>
        <div class="slider"><span class="arrow">◄</span><div class="track" id="track"><div class="ticks"></div><div class="fill" id="fill"></div><div class="knob" id="knob"></div></div><span class="arrow">►</span><span class="val" id="val">100%</span></div></div>
      <div class="item" data-i="1"><span class="lbl" id="lCont">CONTINUAR</span></div>
      <div class="item" data-i="2"><span class="lbl"><span id="lExit">VOLVER AL LAUNCHER</span><span class="sub" id="lExitSub">El progreso no guardado se perderá.</span></span></div>
    </div>
    <div class="hint" id="hMenu">▲ ▼ ELEGIR · ◄ ► VOLUMEN · A ACEPTAR · B CONTINUAR</div>
  </div>
  <!-- confirmación -->
  <div class="view" id="vAsk">
    <h1 id="t">¿Quieres salir y volver al launcher?</h1>
    <p id="sub">El progreso no guardado se perderá.</p>
    <div class="opts">
      <button id="yes">SÍ</button>
      <button id="no" class="on">NO</button>
    </div>
    <div class="hint" id="hint">◄ ► ELEGIR · A ACEPTAR · B CANCELAR</div>
  </div>
</div>
<div id="black"></div>
<script>
(() => {
  const host = window.acHost;
  const $ = (id) => document.getElementById(id);
  const send = (cmd, extra) => host && host.postMessage(JSON.stringify(Object.assign({ cmd }, extra || {})));
  const T = {
    es: { title: 'EN PAUSA', vol: 'VOLUMEN DEL JUEGO', cont: 'CONTINUAR', exit: 'VOLVER AL LAUNCHER', lost: 'El progreso no guardado se perderá.',
      hMenu: '▲ ▼ ELEGIR · ◄ ► VOLUMEN · A ACEPTAR · B CONTINUAR', ask: '¿Quieres salir y volver al launcher?', yes: 'SÍ', no: 'NO', hAsk: '◄ ► ELEGIR · A ACEPTAR · B CANCELAR',
      hMenuK: '▲ ▼ ELEGIR · ◄ ► VOLUMEN · ENTER ACEPTAR · ESC CONTINUAR', hAskK: '◄ ► ELEGIR · ENTER ACEPTAR · ESC CANCELAR' },
    en: { title: 'PAUSED', vol: 'GAME VOLUME', cont: 'CONTINUE', exit: 'BACK TO LAUNCHER', lost: 'Any unsaved progress will be lost.',
      hMenu: '▲ ▼ SELECT · ◄ ► VOLUME · A CONFIRM · B CONTINUE', ask: 'Quit and return to the launcher?', yes: 'YES', no: 'NO', hAsk: '◄ ► CHOOSE · A CONFIRM · B CANCEL',
      hMenuK: '▲ ▼ SELECT · ◄ ► VOLUME · ENTER CONFIRM · ESC CONTINUE', hAskK: '◄ ► CHOOSE · ENTER CONFIRM · ESC CANCEL' },
    fr: { title: 'PAUSE', vol: 'VOLUME DU JEU', cont: 'CONTINUER', exit: 'RETOUR AU LAUNCHER', lost: 'Toute progression non sauvegardée sera perdue.',
      hMenu: '▲ ▼ CHOISIR · ◄ ► VOLUME · A VALIDER · B CONTINUER', ask: 'Quitter et revenir au launcher ?', yes: 'OUI', no: 'NON', hAsk: '◄ ► CHOISIR · A VALIDER · B ANNULER',
      hMenuK: '▲ ▼ CHOISIR · ◄ ► VOLUME · ENTRÉE VALIDER · ÉCHAP CONTINUER', hAskK: '◄ ► CHOISIR · ENTRÉE VALIDER · ÉCHAP ANNULER' }
  };
  let view = 'menu', msel = 1, sel = 1, open = false, locked = false, shownAt = 0, vol = 100;
  const items = [...document.querySelectorAll('.item')];
  const btn = [$('yes'), $('no')];
  let actx = null;
  const tone = (f1, f2, dur, type, vol) => { try { actx = actx || new AudioContext(); const t = actx.currentTime, o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.setValueAtTime(f1, t); o.frequency.exponentialRampToValueAtTime(f2, t + dur);
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g).connect(actx.destination); o.start(t); o.stop(t + dur + .02); } catch (e) {} };
  const SND = { move: () => tone(1800, 2400, .05, 'square', .025), tick: () => tone(2600, 2600, .03, 'square', .02),
    ok: () => { tone(900, 1500, .09, 'sawtooth', .04); setTimeout(() => tone(1500, 2200, .12, 'sine', .06), 70); }, back: () => tone(1100, 500, .12, 'triangle', .06) };
  const play = (n) => SND[n] && SND[n]();
  const paint = () => {
    items.forEach((it, i) => it.classList.toggle('on', i === msel));
    btn.forEach((b, i) => b.classList.toggle('on', i === sel));
    $('fill').style.width = vol + '%'; $('knob').style.left = vol + '%'; $('val').textContent = vol + '%';
  };
  const setView = (v) => { view = v; $('vMenu').classList.toggle('on', v === 'menu'); $('vAsk').classList.toggle('on', v === 'ask'); paint(); };
  let volT = null;
  const setVol = (v, quiet) => {
    v = Math.max(0, Math.min(100, Math.round(v / 5) * 5)); if (v === vol) return;
    vol = v; paint(); if (!quiet) play('tick');
    clearTimeout(volT); volT = setTimeout(() => send('gvol', { value: vol }), 60);   // en vivo, sin saturar
  };
  const resume = () => { if (!open || locked) return; locked = true; play('back'); document.body.classList.remove('show'); setTimeout(() => send('exitNo'), 300); };
  const leave = () => { if (!open || locked) return; locked = true; play('ok'); document.body.classList.add('out'); setTimeout(() => send('exitYes'), 450); };
  const activate = () => {
    if (view === 'menu') {
      if (msel === 1) resume();
      else if (msel === 2) { play('ok'); sel = 1; setView('ask'); }
    } else if (sel === 0) leave(); else { play('back'); setView('menu'); }
  };
  // ratón
  items.forEach((it, i) => {
    it.addEventListener('mouseenter', () => { if (view === 'menu' && msel !== i) { msel = i; paint(); play('move'); } });
    if (i > 0) it.addEventListener('click', () => { msel = i; activate(); });
  });
  btn.forEach((b, i) => { b.addEventListener('mouseenter', () => { if (sel !== i) { sel = i; paint(); play('move'); } }); b.addEventListener('click', () => { sel = i; activate(); }); });
  const tr = $('track');
  tr.addEventListener('pointerdown', (e) => {
    tr.setPointerCapture(e.pointerId); msel = 0;
    const at = (ev) => { const r = tr.getBoundingClientRect(); setVol(Math.max(0, Math.min(1, (ev.clientX - r.left) / r.width)) * 100, true); };
    at(e);
    const up = () => { tr.removeEventListener('pointermove', at); tr.removeEventListener('pointerup', up); play('tick'); };
    tr.addEventListener('pointermove', at); tr.addEventListener('pointerup', up);
  });
  // mando (vía puente) y teclado
  const key = (k) => {
    if (!open || locked) return;
    if (view === 'menu') {
      if (k === 'UP') { msel = (msel + 2) % 3; paint(); play('move'); }
      if (k === 'DOWN') { msel = (msel + 1) % 3; paint(); play('move'); }
      if ((k === 'LEFT' || k === 'RIGHT') && msel === 0) setVol(vol + (k === 'LEFT' ? -5 : 5));
      if (k === 'A') activate();
      if (k === 'B') resume();
    } else {
      if (k === 'LEFT' || k === 'RIGHT') { const n = k === 'LEFT' ? 0 : 1; if (n !== sel) { sel = n; paint(); play('move'); } }
      if (k === 'A') activate();
      if (k === 'B') { play('back'); setView('menu'); }
    }
  };
  let curL = T.es;
  const padMode = (on) => {
    document.documentElement.classList.toggle('padmode', on);
    $('hMenu').textContent = on ? curL.hMenu : curL.hMenuK; $('hint').textContent = on ? curL.hAsk : curL.hAskK;
  };
  let mAt = null;
  addEventListener('mousemove', (e) => { if (mAt && Math.abs(e.screenX - mAt[0]) + Math.abs(e.screenY - mAt[1]) > 12) padMode(false); mAt = [e.screenX, e.screenY]; });
  addEventListener('keydown', (e) => {
    const m = { ArrowLeft: 'LEFT', ArrowRight: 'RIGHT', ArrowUp: 'UP', ArrowDown: 'DOWN', a: 'LEFT', d: 'RIGHT', w: 'UP', s: 'DOWN', Enter: 'A', ' ': 'A', Escape: 'B', Backspace: 'B' };
    if (!m[e.key]) return;
    e.preventDefault(); if (document.documentElement.classList.contains('padmode')) padMode(false);
    if (performance.now() - shownAt < 350) return;                      // la misma pulsación que abrió el menú no lo cierra
    if (e.repeat && !['LEFT', 'RIGHT', 'UP', 'DOWN'].includes(m[e.key])) return;
    key(m[e.key]);
  });
  if (host) host.addEventListener('message', (ev) => {
    let m; try { m = JSON.parse(ev.data); } catch (e) { return; }
    if (m.type === 'show') {
      const L = curL = T[(m.data && m.data.lang) || 'es'] || T.es;
      $('kick').textContent = (m.data && m.data.lang) === 'en' ? 'NEURON · OPERATION IN PROGRESS' : 'NEURON · OPERACIÓN EN CURSO';
      $('mTitle').textContent = L.title; $('lVol').textContent = L.vol; $('lCont').textContent = L.cont; $('lExit').textContent = L.exit; $('lExitSub').textContent = L.lost;
      $('hMenu').textContent = L.hMenu; $('t').textContent = L.ask; $('sub').textContent = L.lost; btn[0].textContent = L.yes; btn[1].textContent = L.no; $('hint').textContent = L.hAsk;
      document.documentElement.lang = (m.data && m.data.lang) || 'es';
      vol = Math.max(0, Math.min(100, parseInt((m.data && m.data.gvol) || '100', 10)));
      padMode(!(m.data && m.data.via === 'kb')); mAt = null;
      msel = 1; sel = 1; setView('menu'); shownAt = performance.now(); locked = false; open = true;
      document.body.classList.remove('out'); requestAnimationFrame(() => document.body.classList.add('show'));
    }
    if (m.type === 'hide') { open = false; document.body.classList.remove('show', 'out'); }
    if (m.type === 'btn') { if (!document.documentElement.classList.contains('padmode')) padMode(true); if (performance.now() - shownAt > 250) key(({ A: 'B', B: 'A' })[m.data] || m.data); }
  });

  // motas de luz
  const cv = $('fx'), ctx = cv.getContext('2d');
  const fit = () => { cv.width = innerWidth; cv.height = innerHeight; }; addEventListener('resize', fit); fit();
  const P = Array.from({ length: 70 }, () => ({ x: Math.random(), y: Math.random(), r: .6 + Math.random() * 2.4, v: .0006 + Math.random() * .0016, ph: Math.random() * 6.3 }));
  const step = () => {
    ctx.clearRect(0, 0, cv.width, cv.height); ctx.globalCompositeOperation = 'lighter';
    for (const p of P) {
      p.y -= p.v; p.ph += .02; if (p.y < -.02) { p.y = 1.02; p.x = Math.random(); }
      const x = (p.x + Math.sin(p.ph) * .004) * cv.width, y = p.y * cv.height, a = .35 + .35 * Math.sin(p.ph * 2);
      const g = ctx.createRadialGradient(x, y, 0, x, y, p.r * 6);
      g.addColorStop(0, 'rgba(120,210,255,' + a + ')'); g.addColorStop(1, 'rgba(60,150,255,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, p.r * 6, 0, 6.283); ctx.fill();
    }
    requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
})();
</script>
</body>
</html>
